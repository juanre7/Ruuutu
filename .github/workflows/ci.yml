name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Sin permisos por defecto: cada job pide lo que necesita y nada más. Un token de sólo
# lectura es lo que limita el daño si una acción de terceros resulta estar comprometida.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    # Ruuutu es exclusivamente Windows: captura por GDI, bandeja del sistema, hook de teclado
    # de bajo nivel y diálogo de guardado por COM. No hay nada que probar en otro runner.
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Este job no empuja nada: dejar el token de git en el checkout solo amplía lo
          # que podría hacer un paso posterior comprometido.
          persist-credentials: false

      - name: Instalar toolchain de Rust
        # Fijada por SHA, así que la acción ya no puede deducir el canal del nombre de la
        # referencia (`@stable`): hay que dárselo en `toolchain`.
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # rama stable
        with:
          toolchain: stable
          # llvm-tools-preview lo exige cargo-llvm-cov: la cobertura sale de la
          # instrumentación del propio LLVM (`-C instrument-coverage`) y necesita
          # `llvm-profdata`/`llvm-cov` de la misma versión que el compilador.
          components: clippy, llvm-tools-preview

      - name: Cachear dependencias
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # La suite unitaria cubre la lógica pura: persistencia de config.rs y geometría de
      # overlay.rs. El resto de la batería (`test_bench`) necesita escritorio real, toca el
      # portapapeles y captura la pantalla, así que no corre aquí.
      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-llvm-cov

      # `cargo llvm-cov` ejecuta los mismos tests que `cargo test --bin ruuutu`, así que
      # este paso sigue siendo la puerta: si un test falla, el build cae aquí. El informe
      # va en formato nativo de Codecov (`--codecov`) y no en lcov porque lcov solo lleva
      # cobertura de línea; el formato propio añade cobertura de región.
      # `--lib` cubre `config` y `storage`, que viven en la biblioteca desde que se separó
      # el núcleo del binario; `--bin ruuutu` cubre la geometría de `overlay.rs`, que sigue
      # dentro del binario porque depende de winit.
      - name: Tests y cobertura
        run: cargo llvm-cov --lib --bin ruuutu --codecov --output-path codecov.json

      - name: Subir cobertura a Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: codecov.json
          slug: juanre7/Ruuutu
          # El repositorio es público, así que la subida funciona sin token; el secreto
          # es opcional y solo sirve para evitar el límite de peticiones anónimas.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Un fallo de red o un límite de Codecov no debe tumbar un build cuyos tests
          # han pasado: la cobertura es informativa, no una puerta.
          fail_ci_if_error: false

      - name: Compilación de release
        run: cargo build --release

      # Puerta real: cualquier aviso nuevo tumba el build. Incluye las herramientas de
      # `devtools`, que comparten los módulos de dibujo con la aplicación.
      #
      # SI ESTE PASO SE ROMPE EN UN PUSH QUE NO TOCA NADA RELACIONADO, ES ESTO:
      # el toolchain de arriba es `stable` flotante, así que el runner puede traer un clippy
      # más nuevo que el de tu máquina y estrenar lints sobre código que ya estaba escrito.
      # Ya pasó una vez: el runner iba con 1.97 y la máquina de desarrollo con 1.94, y
      # `collapsible_match` saltó solo aquí. El aviso era legítimo, así que se arregló y ya.
      #
      # Si esa divergencia acaba molestando más de lo que aporta, la solución es un
      # `rust-toolchain.toml` en la raíz del repositorio fijando una versión concreta:
      #
      #     [toolchain]
      #     channel = "1.97"
      #     components = ["clippy"]
      #
      # rustup lo respeta tanto en local como en CI, así que las dos partes dejan de
      # divergir y subir de versión pasa a ser un acto deliberado, no una sorpresa. El
      # precio es que los lints nuevos ya no llegan solos. Decisión aplazada a propósito:
      # de momento compensa enterarse de ellos.
      - name: Clippy
        run: cargo clippy --all-targets --features devtools -- -D warnings

  # El núcleo (`src/lib.rs`) no toca Win32, y esa portabilidad no es un adorno: es lo que
  # permite fuzzearlo con cargo-fuzz, que no existe en Windows. Sin este job, alguien
  # añadiría una llamada a Win32 en `config.rs` o `storage.rs`, el CI de Windows pasaría
  # tan contento, y el fuzzing se rompería sin que nadie lo relacionase con el cambio.
  core-portable:
    name: Núcleo portable (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar toolchain de Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # rama stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Solo `--lib`: el binario es de Windows y aquí no compila, que es exactamente lo
      # que se quiere.
      - name: Tests del núcleo
        run: cargo test --lib

      - name: Clippy del núcleo
        run: cargo clippy --lib -- -D warnings

      # Los targets de fuzzing viven en un crate aparte y fuera del workspace, así que
      # ningún `cargo` de la raíz los compila. Sin esto se pudrirían en silencio.
      - name: Compilar los targets de fuzzing
        working-directory: fuzz
        run: cargo check --all-targets
