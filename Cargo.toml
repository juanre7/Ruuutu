[package]
name = "ruuutu"
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
default-run = "ruuutu"
build = "build.rs"
license = "GPL-3.0-or-later"
description = "Utilidad de captura de pantalla ligera para Windows, estilo Lightshot, escrita en Rust sin GPU ni frameworks pesados."
repository = "https://github.com/juanre7/Ruuutu"
readme = "README.md"
keywords = ["screenshot", "screen-capture", "windows", "tray", "lightshot"]
categories = ["multimedia::images", "os::windows-apis"]
exclude = ["/.github"]

# Herramientas internas de diseño y pruebas manuales. Van tras una feature para que
# `cargo build --release` y `cargo install` produzcan solo `ruuutu.exe` y no dejen cinco
# binarios de desarrollo en el PATH del usuario.
[features]
devtools = []

# El núcleo puro: persistencia de ajustes y codificación de imagen, sin nada de Win32.
# Existe para que ese código se pueda compilar, testear y fuzzear fuera de Windows; el
# binario lo reexporta en lugar de declarar los módulos otra vez, así que hay una única
# copia de la lógica.
[lib]
name = "ruuutu"
path = "src/lib.rs"

[[bin]]
name = "ruuutu"
path = "src/main.rs"

[[bin]]
name = "font_preview"
path = "src/bin/font_preview.rs"
required-features = ["devtools"]

[[bin]]
name = "margin_preview"
path = "src/bin/margin_preview.rs"
required-features = ["devtools"]

[[bin]]
name = "margin_editor"
path = "src/bin/margin_editor.rs"
required-features = ["devtools"]

[[bin]]
name = "tray_editor"
path = "src/bin/tray_editor.rs"
required-features = ["devtools"]

[[bin]]
name = "clipboard_test"
path = "src/bin/clipboard_test.rs"
required-features = ["devtools"]

[[bin]]
name = "test_bench"
path = "src/bin/test_bench.rs"
required-features = ["devtools"]

# Dependencias del núcleo (`src/lib.rs`): ajustes y codificación de imagen. Son las únicas
# que no dependen del sistema de ventanas, y por eso son las únicas incondicionales: el
# núcleo compila en cualquier plataforma, que es lo que permite fuzzearlo con cargo-fuzz
# (libFuzzer necesita los sanitizers de LLVM y no existe en Windows).
[dependencies]
anyhow = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# libwebp real: el encoder WebP de `image` es solo VP8L sin pérdidas (sin parámetro de calidad).
webp = { version = "0.3", default-features = false }
dirs = "5.0"
chrono = "0.4"

# Solo en tiempo de compilación: rasterizan e incrustan el icono del .exe. No entran en el binario.
[build-dependencies]
embed-resource = "3"
image = { version = "0.25", default-features = false, features = ["png"] }

# Todo lo demás es la aplicación: superposición, bandeja, portapapeles, atajo global y las
# API de Win32. Ruuutu solo se ejecuta en Windows, así que estas dependencias van tras el
# `cfg` en lugar de arrastrarlas a una compilación del núcleo que nunca las usa.
[target.'cfg(windows)'.dependencies]
ab_glyph = "0.2"
resvg = "0.44"
arboard = "3.4"
winit = "0.30"
softbuffer = "0.4"
global-hotkey = "0.6"
tray-icon = "0.24"

windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell_Common"] }
windows-core = "0.62"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
