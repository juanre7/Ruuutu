# Configuración de Codecov (https://docs.codecov.com/docs/codecov-yaml).
#
# La cobertura de Ruuutu nunca va a ser alta y eso no es un defecto: la mayor parte del
# código toca GDI, la bandeja del sistema, un hook de teclado de bajo nivel y diálogos COM,
# nada de lo cual se puede ejecutar en un runner sin sesión gráfica. Lo que sí se mide es la
# lógica pura —persistencia de `config.rs` y geometría de `overlay.rs`—, que es justo donde
# los bugs silenciosos han aparecido antes.
#
# Por eso los estados son `informational`: comentan en el pull request pero no lo bloquean.

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true

# Se excluyen los módulos que no tienen ninguna línea ejecutable sin sesión de escritorio.
# No es maquillar el número: contarlos como "sin cubrir" mide algo que no se puede medir aquí
# y deja un porcentaje que parece un repositorio roto cuando la aplicación funciona. Lo que
# queda dentro sí es lógica que un runner puede ejecutar, así que ahí el número significa algo.
#
# Si alguno de estos módulos llega a tener partes puras separables, se sacan a su propio
# módulo y se quitan de aquí, en vez de relajar la lista.
ignore:
  # Binarios auxiliares de diseño visual (feature `devtools`): no son producto.
  - "src/bin/**"
  - "build.rs"
  # Event loop de winit y máquina de estados de la aplicación: necesita ventana y bandeja.
  - "src/main.rs"
  # Diálogo "Guardar como" por COM (IFileSaveDialog): abre UI modal de Windows.
  - "src/save_dialog.rs"
  # Icono y menú del área de notificación: Shell_NotifyIconW.
  - "src/tray.rs"
  # Captura GDI del escritorio virtual: BitBlt/GetDIBits sobre el escritorio de entrada.
  - "src/capture.rs"
  # Atajos globales y hook WH_KEYBOARD_LL: se registran contra la sesión interactiva.
  - "src/hotkey.rs"
  # AttachConsole del proceso padre.
  - "src/console.rs"
  # Portapapeles vía OLE.
  - "src/clipboard.rs"
